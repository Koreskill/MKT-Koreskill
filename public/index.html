<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>Koreskill Campaign Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ─────────────────────────  TOKENS  ───────────────────────── */
:root{
  --bg:#FBF8F7;
  --surface:#FFFFFF;
  --surface-2:#F5F0EF;
  --ink:#1B1516;
  --ink-2:#4A4042;
  --muted:#8B7E80;
  --line:#E9E0DE;
  --line-strong:#D6C9C7;
  --accent:#FF7970;
  --accent-deep:#D6423A;
  --accent-wash:#FFEDEB;
  --ok:#2F8F63;
  --ok-wash:#E4F3EB;
  --warn:#B57A12;
  --warn-wash:#FBF0DC;
  --crit:#C4392F;
  --crit-wash:#FBE7E5;
  --shadow:0 1px 2px rgba(27,21,22,.05), 0 8px 24px -12px rgba(27,21,22,.14);
  --radius:10px;
  --f-display:"Bricolage Grotesque", "Helvetica Neue", sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141011;
    --surface:#1C1718;
    --surface-2:#241E1F;
    --ink:#F4EEED;
    --ink-2:#C9BEBF;
    --muted:#8E8082;
    --line:#2E2627;
    --line-strong:#413638;
    --accent:#FF8F87;
    --accent-deep:#FFB3AD;
    --accent-wash:#33211F;
    --ok:#5FBF8D;
    --ok-wash:#1B2E24;
    --warn:#D9A54A;
    --warn-wash:#2E2617;
    --crit:#E8756A;
    --crit-wash:#331E1C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#141011;
  --surface:#1C1718;
  --surface-2:#241E1F;
  --ink:#F4EEED;
  --ink-2:#C9BEBF;
  --muted:#8E8082;
  --line:#2E2627;
  --line-strong:#413638;
  --accent:#FF8F87;
  --accent-deep:#FFB3AD;
  --accent-wash:#33211F;
  --ok:#5FBF8D;
  --ok-wash:#1B2E24;
  --warn:#D9A54A;
  --warn-wash:#2E2617;
  --crit:#E8756A;
  --crit-wash:#331E1C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.015em}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ─────────────────────────  SHELL  ───────────────────────── */
.app{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}

.rail{
  border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; gap:22px; padding:20px 16px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
@media(max-width:900px){.rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line)}}

.brand{display:flex; align-items:center; gap:9px}
.brand-mark{
  width:26px; height:26px; border-radius:7px; flex:none;
  background:linear-gradient(145deg,var(--accent),var(--accent-deep));
  display:grid; place-items:center; color:#fff;
  font-family:var(--f-display); font-weight:800; font-size:14px;
}
.brand-name{font-family:var(--f-display); font-weight:700; font-size:15px; line-height:1.1}
.brand-sub{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}

.rail-label{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:block}

.cli-select{
  width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px;
  background:var(--surface-2); font-size:13.5px; font-weight:500;
}
.rail-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}

.stages{display:flex; flex-direction:column; gap:3px}
.stage{
  display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start;
  padding:9px 10px; border-radius:8px; border:1px solid transparent;
  background:none; cursor:pointer; text-align:left; width:100%;
}
.stage:hover{background:var(--surface-2)}
.stage[aria-current="true"]{background:var(--accent-wash); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.stage-n{
  font-family:var(--f-mono); font-size:10px; font-weight:600; color:var(--muted);
  border:1px solid var(--line-strong); border-radius:5px; width:22px; height:22px;
  display:grid; place-items:center; margin-top:1px;
}
.stage[aria-current="true"] .stage-n{background:var(--accent); border-color:var(--accent); color:#fff}
.stage-t{display:block; font-family:var(--f-display); font-weight:600; font-size:14px; line-height:1.2}
.stage-d{display:block; font-size:11.5px; color:var(--muted); line-height:1.35; margin-top:2px}
.stage-bar{grid-column:2; height:3px; border-radius:2px; background:var(--line); margin-top:7px; overflow:hidden}
.stage-bar i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .3s}

.rail-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px}

/* ─────────────────────────  MAIN  ───────────────────────── */
.main{padding:26px 30px 80px; max-width:1180px}
@media(max-width:640px){.main{padding:20px 16px 60px}}

.page-head{margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep)}
.page-head h1{font-size:clamp(24px,3.4vw,32px); font-weight:800; margin-top:5px}
.page-head p{color:var(--muted); margin:6px 0 0; max-width:62ch; font-size:14px}

.subnav{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:22px}
.subnav button{
  padding:6px 12px; border-radius:99px; border:1px solid var(--line-strong);
  background:var(--surface); font-size:13px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
}
.subnav button:hover{border-color:var(--muted)}
.subnav button[aria-current="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.subnav .dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); flex:none}
.subnav button[data-done="1"] .dot{background:var(--ok)}

/* ── generic pieces ── */
.btn{
  padding:7px 13px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); font-size:13px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn-primary:hover{background:var(--accent-deep); border-color:var(--accent-deep)}
.btn-sm{padding:4px 9px; font-size:12px; border-radius:6px}
.btn-ghost{background:none; border-color:transparent; color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}

.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

.field{display:flex; flex-direction:column; gap:5px}
.field label{font-family:var(--f-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.field input,.field select,.field textarea{
  padding:8px 10px; border:1px solid var(--line-strong); border-radius:7px;
  background:var(--bg); font-size:14px; width:100%;
}
.field textarea{resize:vertical; min-height:74px; line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent); outline:none}

.sec-title{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:10px; margin:26px 0 12px;
}
.sec-title::after{content:""; flex:1; height:1px; background:var(--line)}

/* ── bloque de prompt ── */
.block{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden; box-shadow:var(--shadow)}
.block + .block{margin-top:14px}
.block-head{
  display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer;
  background:none; border:0; width:100%; text-align:left;
}
.block-head:hover{background:var(--surface-2)}
.block-code{font-family:var(--f-mono); font-size:11px; font-weight:600; color:var(--accent-deep); flex:none}
.block-title{font-family:var(--f-display); font-weight:600; font-size:15.5px; flex:1; min-width:0}
.block-title small{display:block; font-family:var(--f-body); font-weight:400; font-size:12.5px; color:var(--muted); letter-spacing:0}
.block-body{padding:0 18px 18px; border-top:1px solid var(--line)}
.block-body.hide{display:none}

.chip{
  font-family:var(--f-mono); font-size:10px; font-weight:600; letter-spacing:.06em;
  padding:3px 8px; border-radius:99px; text-transform:uppercase; white-space:nowrap;
}
.chip-todo{background:var(--surface-2); color:var(--muted); border:1px solid var(--line-strong)}
.chip-ok{background:var(--ok-wash); color:var(--ok)}
.chip-warn{background:var(--warn-wash); color:var(--warn)}
.chip-crit{background:var(--crit-wash); color:var(--crit)}
.chip-accent{background:var(--accent-wash); color:var(--accent-deep)}

.flow{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px}
@media(max-width:760px){.flow{grid-template-columns:1fr}}
.flow-step{display:flex; flex-direction:column; gap:8px; min-width:0}
.flow-n{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.prompt-box{
  font-family:var(--f-mono); font-size:11.5px; line-height:1.55; white-space:pre-wrap;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:12px; max-height:250px; overflow:auto; color:var(--ink-2);
}
.paste-box{
  font-family:var(--f-mono); font-size:11.5px; line-height:1.5; min-height:250px;
  background:var(--bg); border:1px solid var(--line-strong); border-radius:8px; padding:12px;
  width:100%; resize:vertical;
}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.hint{font-size:12px; color:var(--muted)}
.err{font-size:12.5px; color:var(--crit); background:var(--crit-wash); padding:8px 10px; border-radius:7px}

/* ── render de resultados ── */
.out{margin-top:18px; border-top:1px dashed var(--line-strong); padding-top:18px}
.kv{display:grid; grid-template-columns:130px 1fr; gap:6px 16px; align-items:baseline}
@media(max-width:560px){.kv{grid-template-columns:1fr; gap:2px 0}.kv dt{margin-top:10px}}
.kv dt{font-family:var(--f-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.kv dd{margin:0; font-size:14px}

.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:3px 10px; font-size:12.5px}

.swatches{display:flex; flex-wrap:wrap; gap:10px}
.sw{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:6px 10px 6px 6px; background:var(--surface-2)}
.sw i{width:26px; height:26px; border-radius:6px; border:1px solid rgba(0,0,0,.12); display:block}
.sw b{font-family:var(--f-mono); font-size:11px; font-weight:600; display:block}
.sw span{font-size:11.5px; color:var(--muted)}

table.data{width:100%; border-collapse:collapse; font-size:13.5px}
.scroll-x{overflow-x:auto; border:1px solid var(--line); border-radius:8px}
table.data th{
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.data td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:nth-child(even){background:var(--surface-2)}

.pain{display:grid; grid-template-columns:auto 1fr; gap:8px 12px; align-items:baseline}
.pain-t{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-deep)}

.ang{border-left:3px solid var(--accent); padding:2px 0 2px 14px}
.ang + .ang{margin-top:16px}
.ang h4{font-size:15px; font-weight:600}
.ang .meta{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px}

.hooklist{display:flex; flex-direction:column; gap:0}
.hooklist li{
  list-style:none; padding:8px 0 8px 30px; border-bottom:1px solid var(--line);
  position:relative; font-size:14px; counter-increment:h;
}
.hooklist li::before{
  content:counter(h,decimal-leading-zero); position:absolute; left:0; top:9px;
  font-family:var(--f-mono); font-size:10px; color:var(--muted);
}
.hooklist{counter-reset:h; padding:0; margin:0}

.script{border:1px solid var(--line); border-radius:8px; overflow:hidden}
.script + .script{margin-top:12px}
.script-h{padding:11px 14px; background:var(--surface-2); display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.script-h b{font-family:var(--f-display); font-size:14.5px}
.script-b{padding:12px 14px}
.beat{display:grid; grid-template-columns:64px 1fr; gap:4px 12px; padding:8px 0; border-bottom:1px dashed var(--line)}
.beat:last-child{border-bottom:0}
.beat time{font-family:var(--f-mono); font-size:11px; color:var(--accent-deep); font-variant-numeric:tabular-nums}
.beat .voz{font-size:14px}
.beat .img{grid-column:2; font-size:12.5px; color:var(--muted); font-style:italic}

.creative{border:1px solid var(--line); border-radius:8px; padding:14px; background:var(--surface)}
.creative h4{font-size:14.5px; margin-bottom:2px}
.creative .fmt{font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.creative pre{
  font-family:var(--f-mono); font-size:11px; line-height:1.5; white-space:pre-wrap; margin:10px 0 0;
  background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:10px; max-height:180px; overflow:auto;
}

.slides{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:10px}
.slide{border:1px solid var(--line); border-radius:7px; padding:10px; background:var(--surface-2); font-size:13px}
.slide b{font-family:var(--f-mono); font-size:9.5px; color:var(--muted); display:block; letter-spacing:.1em}
.slide i{display:block; font-size:11.5px; color:var(--muted); margin-top:6px}

/* ── productos ── */
.prod{display:grid; grid-template-columns:1fr auto; gap:12px; padding:14px 0; border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}

/* ── calendario ── */
.week{margin-bottom:24px}
.week-h{display:flex; align-items:baseline; gap:12px; margin-bottom:10px}
.week-h h3{font-size:17px; font-weight:700}
.week-h .count{font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.pieces{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.piece{
  border:1px solid var(--line); border-radius:9px; background:var(--surface);
  display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow);
}
.piece[data-estado="aprobado"]{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.piece[data-estado="correccion"]{border-color:color-mix(in srgb,var(--crit) 50%,var(--line))}
.piece-img{
  aspect-ratio:4/5; background:var(--surface-2); display:grid; place-items:center;
  border-bottom:1px solid var(--line); position:relative; overflow:hidden;
}
.piece-img img{width:100%; height:100%; object-fit:cover; display:block}
.piece-img .ph{font-family:var(--f-mono); font-size:10px; color:var(--muted); letter-spacing:.1em; text-align:center; padding:10px}
.piece-b{padding:11px 12px; display:flex; flex-direction:column; gap:7px; flex:1}
.piece-meta{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.piece-day{font-family:var(--f-mono); font-size:10px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); padding:2px 6px; border-radius:5px}
.piece-t{font-family:var(--f-display); font-size:14px; font-weight:600; line-height:1.25}
.piece-idea{font-size:12.5px; color:var(--muted); line-height:1.4}
.piece-foot{margin-top:auto; padding-top:8px; border-top:1px solid var(--line); display:flex; gap:5px; flex-wrap:wrap}
.comments{margin-top:8px; display:flex; flex-direction:column; gap:6px}
.cmt{font-size:12.5px; background:var(--surface-2); border-radius:7px; padding:7px 9px; border-left:2px solid var(--accent)}
.cmt b{font-family:var(--f-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:block}

.empty{
  border:1px dashed var(--line-strong); border-radius:var(--radius); padding:36px 24px;
  text-align:center; color:var(--muted); background:var(--surface);
}
.empty h3{font-size:16px; color:var(--ink); margin-bottom:6px}
.empty p{margin:0 auto; max-width:44ch; font-size:13.5px}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px;
  font-size:13px; font-weight:500; box-shadow:var(--shadow); z-index:99;
}

/* ── vista cliente ── */
.client-view .rail{display:none}
.client-view .app{grid-template-columns:1fr}
.client-band{
  background:var(--ink); color:var(--bg); padding:10px 30px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.client-band .who{font-family:var(--f-display); font-weight:600; font-size:14px}
.client-band .who span{display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; opacity:.65}
.stat-row{display:flex; gap:18px; flex-wrap:wrap}
.stat{display:flex; flex-direction:column}
.stat b{font-family:var(--f-mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-family:var(--f-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; opacity:.65}
@media(max-width:640px){.client-band{margin:-20px -16px 20px!important; padding:12px 16px}}
</style>

<div class="app" id="app">
  <aside class="rail" id="rail"></aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   KORESKILL CAMPAIGN STUDIO — núcleo
   Capa Store aislada: cambiar los 3 métodos para migrar a Supabase.
   ═══════════════════════════════════════════════════════════ */

const KEY = 'koreskill.studio.v3';

const Store = {
  read(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } },
  write(db){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ console.warn('sin persistencia', e); } },
  reset(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};

const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nl  = s => esc(s).replace(/\n/g,'<br>');
const $   = (sel,root=document) => root.querySelector(sel);
const $$  = (sel,root=document) => [...root.querySelectorAll(sel)];

  return {

function toast(msg){
  $$('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

function ctx(c){
  const b = c.bloques||{};
  const prods = c.productos.length
    ? c.productos.map(p=>`- ${p.nombre}${p.estrella?' (ESTRELLA)':''} — ${p.descripcion||'sin descripción'} — ${p.precio||'precio a definir'} — para ${p.publico||'público general'}`).join('\n')
    : '(sin productos cargados todavía)';
  const estrella = c.productos.find(p=>p.estrella) || c.productos[0] || {nombre:'(producto a definir)', precio:'', descripcion:''};

  let ident = '(todavía sin tablero de identidad)';
  if(b.M1?.data){ const d=b.M1.data;
    ident = `${d.quien_es||''} · Hace: ${d.que_hace||''} · Para: ${d.para_quien||''} · Diferencial: ${d.diferencial||''} · Tono: ${d.tono||''} · En una frase: ${d.frase||''}`;
  }
  let avatar = '(todavía sin avatar definido)';
  let dolorP = '(dolor principal a definir)';
  if(b.M2?.data){ const d=b.M2.data;
    const dol = (d.dolores||[]).map(x=>`${x.tipo}: ${x.texto}`).join(' | ');
    avatar = `${d.nombre||'Avatar'} — ${d.demografia||''}. Dolores: ${dol}. Sueños: ${(d.suenos||[]).join('; ')}. Disparador de compra: ${d.disparador||''}. Dice: "${d.frase||''}"`;
    dolorP = (d.dolores||[])[0]?.texto || dolorP;
  }
  let angulos = '(todavía sin ángulos definidos)';
  if(b.M4?.data){
    angulos = (b.M4.data.angulos||[]).map(a=>`[${a.tipo}] ${a.nombre} → ${a.que_dice}`).join('\n');
  }
  let matriz = '(todavía sin matriz dolor→producto)';
  if(b.M3?.data){
    matriz = (b.M3.data.matriz||[]).map(m=>`${m.dolor} → ${m.producto} → ${m.resultado}`).join('\n');
  }
  const objecion = (b.M2?.data?.objeciones||[])[0] || '"es caro / lo pienso"';

  return {
    nombre:c.nombre||'(marca)', rubro:c.rubro||'(rubro)', ciudad:c.ciudad||'(ciudad)', pais:c.pais||'Argentina',
    web:c.web||'(sin web)', instagram:c.instagram||'(sin instagram)',
    descripcion:c.descripcion||'(sin descripción cargada)', diferencial:c.diferencial||'(sin diferencial cargado)',
    tono:c.tono||'(sin tono definido)', tono_visual:c.tono_visual||'(sin tono visual definido)',
    colores:c.colores||'(sin paleta)', tipografia:c.tipografia||'(sin tipografía)', tipografia2:c.tipografia2||'—',
    presupuesto:c.presupuesto||'(a definir)',
    productos:prods, estrella:estrella.nombre, estrella_desc:estrella.descripcion||'', estrella_precio:estrella.precio||'',
    identidad:ident, avatar, dolor:dolorP, angulos, matriz, objecion
  };
}

/* ═══════════ PARSER DE RESPUESTAS ═══════════ */
function parseRespuesta(texto){
  if(!texto || !texto.trim()) return {error:'Pegá primero la respuesta de Claude.'};
  // 1) bloque ```json ... ```
  let m = texto.match(/```(?:json)?\s*([\s\S]*?)```/i);
  let cand = m ? m[1] : null;
  // 2) sin fences: primer { hasta el último }
  if(!cand){
    const a = texto.indexOf('{'), b = texto.lastIndexOf('}');
    if(a>=0 && b>a) cand = texto.slice(a, b+1);
  }
  if(!cand) return {error:'No encontré el bloque JSON. Pedile a Claude que lo agregue al final tal cual está en el prompt.'};
  cand = cand.trim()
    .replace(/^json\s*/i,'')
    .replace(/,\s*([}\]])/g,'$1')          // comas colgando
    .replace(/[“”]/g,'"')        // comillas tipográficas
    .replace(/[‘’]/g,"'");
  try{
    const data = JSON.parse(cand);
    if(typeof data !== 'object' || data === null) return {error:'El JSON no es un objeto.'};
    return {data};
  }catch(e){
    return {error:'El JSON tiene un error de sintaxis ('+e.message+'). Pedile a Claude que lo devuelva de nuevo, solo el bloque.'};
  }
}

/* ═══════════ EFECTOS AL ESTRUCTURAR ═══════════ */
const APLICA = {
  T1(c, d){
    const nuevas = (d.piezas||[]).map(p=>({
      id: uid(), dia: +p.dia||1, semana: +p.semana || Math.ceil((+p.dia||1)/7),
      canal: p.canal||'organico', formato: p.formato||'feed', angulo: p.angulo||'',
      titulo: p.titulo||'', idea: p.idea||'', cta: p.cta||'',
      img:'', estado:'pendiente', comentarios:[]
    }));
    // conserva imágenes/estados de piezas con el mismo día+título
    const viejo = new Map(c.piezas.map(p=>[p.dia+'|'+p.titulo, p]));
    nuevas.forEach(n=>{ const v = viejo.get(n.dia+'|'+n.titulo); if(v){ n.img=v.img; n.estado=v.estado; n.comentarios=v.comentarios; } });
    c.piezas = nuevas.sort((a,b)=>a.dia-b.dia);
  }
};

/* ═══════════ PROGRESO ═══════════ */
function progreso(c, etapa){
  const bs = BLOQUES.filter(b=>b.etapa===etapa);
  const hechos = bs.filter(b=>c.bloques[b.id]?.data).length;
  return {hechos, total:bs.length, pct: bs.length? Math.round(hechos/bs.length*100):0};
}
function progCal(c){
  const t=c.piezas.length; if(!t) return {hechos:0,total:0,pct:0};
  const a=c.piezas.filter(p=>p.estado==='aprobado').length;
  return {hechos:a, total:t, pct: Math.round(a/t*100)};
}

/* ═══════════ BLOQUE DE PROMPT ═══════════ */
function bloqueHTML(c, b, abiertoForzado){
  const est = c.bloques[b.id];
  const falta = (b.needs||[]).filter(n=>!c.bloques[n]?.data);
  const abierto = abiertoForzado || UI.abierto===b.id;
  const chip = est?.data ? '<span class="chip chip-ok">estructurado</span>'
             : falta.length ? `<span class="chip chip-warn">falta ${falta.join(' + ')}</span>`
             : '<span class="chip chip-todo">pendiente</span>';
  const prompt = b.build(c);

  return `<div class="block" data-block="${b.id}">
    ${abiertoForzado?'':`<button class="block-head" data-toggle="${b.id}">
      <span class="block-code">${b.code}</span>
      <span class="block-title">${esc(b.title)}<small>${esc(b.sub)}</small></span>
      ${chip}
      <span style="color:var(--muted); font-size:12px">${abierto?'−':'+'}</span>
    </button>`}
    <div class="block-body ${abierto?'':'hide'}" ${abiertoForzado?'style="border-top:0; padding-top:0"':''}>
      ${abiertoForzado?`<div class="row" style="margin-bottom:6px; padding-top:4px">${chip}<span class="hint">${esc(b.sub)}</span></div>`:''}
      ${falta.length?`<p class="err" style="margin-top:14px">Este prompt rinde mucho más con ${falta.join(' y ')} ya estructurado. Podés usarlo igual, pero va a inventar lo que falta.</p>`:''}
      ${b.adjuntar?`<p class="hint" style="margin-top:14px">${esc(b.adjuntar)}</p>`:''}

      <div class="flow">
        <div class="flow-step">
          <div class="flow-n">Paso 1 — copiá esto en Claude o ChatGPT</div>
          <div class="prompt-box" id="pb_${b.id}">${esc(prompt)}</div>
          <div class="row">
            <button class="btn btn-primary btn-sm" data-copiar="${b.id}">Copiar prompt</button>
            <span class="hint">${prompt.length.toLocaleString('es-AR')} caracteres</span>
          </div>
        </div>
        <div class="flow-step">
          <div class="flow-n">Paso 2 — pegá la respuesta completa acá</div>
          <textarea class="paste-box" id="pr_${b.id}" placeholder="Pegá todo lo que devolvió Claude, incluido el bloque JSON del final.">${esc(est?.raw||'')}</textarea>
          <div class="row">
            <button class="btn btn-primary btn-sm" data-estructurar="${b.id}">Estructurar</button>
            ${est?.data?`<button class="btn btn-sm btn-ghost" data-limpiar="${b.id}">Borrar</button>
              <span class="hint">${new Date(est.ts).toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}</span>`:''}
            ${b.aplica?`<span class="hint">${esc(b.aplica)}</span>`:''}
          </div>
          <div id="msg_${b.id}"></div>
        </div>
      </div>

      ${est?.data ? `<div class="out">${RENDER[b.id] ? RENDER[b.id](est.data) : ''}</div>` : ''}
    </div>
  </div>`;
}

}

function viewClienteRender(c){
  const n = e => c.piezas.filter(p=>p.estado===e).length;
  const semanas = [...new Set(c.piezas.map(p=>p.semana))].sort((a,b)=>a-b);
  document.body.classList.add('client-view');
  document.getElementById('main').innerHTML = `
    <div class="client-band" style="margin:-26px -30px 26px">
      <div class="who">${esc(c.nombre)}<span>Contenido del mes · Koreskill</span></div>
      <div class="stat-row">
        <div class="stat"><b>${c.piezas.length}</b><span>piezas</span></div>
        <div class="stat"><b>${n('aprobado')}</b><span>aprobadas</span></div>
        <div class="stat"><b>${n('correccion')}</b><span>a corregir</span></div>
      </div>
      <button class="btn btn-sm" id="btnSalirVista">Volver al admin</button>
    </div>
    <div class="page-head" style="border:0; padding:0; margin-bottom:22px">
      <div class="eyebrow">Aprobación de contenido</div>
      <h1>Tu mes en Instagram</h1>
      <p>Mirá cada pieza y decinos si va o si querés cambiar algo. Lo que aprobás pasa a producción; lo que marcás lo rehacemos.</p>
    </div>
    ${c.piezas.length ? semanas.map(s=>`<section class="week">
      <div class="week-h"><h3>Semana ${s}</h3><span class="count">${c.piezas.filter(p=>p.semana===s).length} piezas</span></div>
      <div class="pieces">${c.piezas.filter(p=>p.semana===s).map(p=>piezaHTML(p,true)).join('')}</div>
    </section>`).join('') : '<div class="empty"><h3>Estamos armando tu mes</h3><p>En cuanto esté listo lo vas a ver acá.</p></div>'}`;
}

/* ═══════════ RENDER ═══════════ */
function render(){
  const c = cli();
  if(UI.vistaCliente){ viewClienteRender(c); return; }
  document.body.classList.remove('client-view');
  renderRail();
  const m = document.getElementById('main');
  m.innerHTML = UI.etapa==='marca' ? viewMarca(c)
              : UI.etapa==='trabajo' ? viewTrabajo(c)
              : viewCalendario(c);
}

/* ═══════════ MODAL ═══════════ */
function modal(titulo, cuerpo, onOk, okLabel){
  document.querySelectorAll('.ovl').forEach(o=>o.remove());
  const o = document.createElement('div');
  o.className = 'ovl';
  o.style.cssText = 'position:fixed; inset:0; background:rgba(20,16,17,.55); display:grid; place-items:center; padding:20px; z-index:100';
  o.innerHTML = `<div class="card card-pad" style="max-width:620px; width:100%; max-height:82vh; overflow:auto">
    <h3 style="font-size:18px; margin-bottom:12px">${esc(titulo)}</h3>
    <div id="ovlBody">${cuerpo}</div>
    <div class="row" style="margin-top:16px; justify-content:flex-end">
      <button class="btn btn-sm" data-ovl-cancel>Cancelar</button>
      ${onOk?`<button class="btn btn-primary btn-sm" data-ovl-ok>${esc(okLabel||'Guardar')}</button>`:''}
    </div></div>`;
  document.body.appendChild(o);
  const cerrar = ()=>o.remove();
  o.addEventListener('click', e=>{
    if(e.target===o || e.target.closest('[data-ovl-cancel]')) cerrar();
    if(e.target.closest('[data-ovl-ok]')){ if(onOk(o)!==false) cerrar(); }
  });
  const f = o.querySelector('textarea,input'); if(f) f.focus();
  return o;
}

/* ═══════════ COPIAR ═══════════ */
function copiar(texto, msg){
  const done = ()=>toast(msg||'Copiado');
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(texto).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=texto;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('No pude copiar — seleccioná y copiá a mano'); }
    ta.remove();
  }
}

/* ═══════════ IMAGEN → dataURL comprimido ═══════════ */
function leerImagen(file, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      const r = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*r); cv.height = Math.round(img.height*r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => cb(fr.result);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ═══════════ EVENTOS ═══════════ */
document.addEventListener('input', e=>{
  const c = cli();
  const campo = e.target.dataset.campo;
  if(campo){ c[campo] = e.target.value; save(); return; }
  const pc = e.target.dataset.pcampo;
  if(pc){
    const id = e.target.closest('[data-prod]')?.dataset.prod;
    const p = c.productos.find(x=>x.id===id);
    if(p){ p[pc] = e.target.value; save(); }
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='selCli'){ UI.cliente = e.target.value; UI.sub=null; UI.abierto=null; save(); render(); return; }
  if(e.target.dataset.campo==='nombre') renderRail();
});

document.addEventListener('click', e=>{
  const c = cli();
  const t = e.target;
  const d = sel => t.closest('['+sel+']');

  /* navegación */
  const et = d('data-etapa');  if(et){ UI.etapa = et.dataset.etapa; UI.abierto=null; render(); return; }
  const sb = d('data-sub');    if(sb){ UI.sub = sb.dataset.sub; render(); return; }
  const fl = d('data-filtro'); if(fl){ UI.filtro = fl.dataset.filtro; render(); return; }
  const tg = d('data-toggle'); if(tg){ UI.abierto = UI.abierto===tg.dataset.toggle ? null : tg.dataset.toggle; render(); return; }

  /* prompts */
  const cp = d('data-copiar');
  if(cp){ copiar(BLOQUE(cp.dataset.copiar).build(c), 'Prompt copiado — pegalo en Claude con los documentos de la marca'); return; }

  const es = d('data-estructurar');
  if(es){
    const id = es.dataset.estructurar;
    const raw = document.getElementById('pr_'+id).value;
    const msg = document.getElementById('msg_'+id);
    const r = parseRespuesta(raw);
    if(r.error){ msg.innerHTML = `<p class="err" style="margin-top:10px">${esc(r.error)}</p>`; return; }
    c.bloques[id] = {raw, data:r.data, ts:Date.now()};
    if(APLICA[id]) APLICA[id](c, r.data);
    save(); render();
    toast(id==='T1' ? `Calendario cargado — ${c.piezas.length} piezas en la etapa 3` : 'Estructurado');
    return;
  }
  const lp = d('data-limpiar');
  if(lp){ delete c.bloques[lp.dataset.limpiar]; save(); render(); return; }

  const cpp = d('data-copy-prompt');
  if(cpp){
    const cr = (c.bloques.T2?.data?.creativos||[]).find(x=>String(x.n)===cpp.dataset.copyPrompt);
    if(cr) copiar(cr.prompt_en + (cr.anti_ai?.length ? '\n\nANTI-AI RULES:\n- '+cr.anti_ai.join('\n- ') : ''), 'Prompt de imagen copiado');
    return;
  }
  const ct = d('data-copy-txt'); if(ct){ copiar(ct.dataset.copyTxt, 'Mensaje copiado'); return; }

  /* productos */
  if(t.id==='btnAddProd'){ c.productos.push(mkProd()); save(); render(); return; }
  const ep = d('data-estrella');
  if(ep){ c.productos.forEach(p=>p.estrella = p.id===ep.dataset.estrella ? !p.estrella : false); save(); render(); return; }
  const dp = d('data-delprod');
  if(dp){ c.productos = c.productos.filter(p=>p.id!==dp.dataset.delprod); save(); render(); return; }

  /* piezas */
  const pz = id => c.piezas.find(p=>p.id===id);
  const su = d('data-subir');
  if(su){
    const p = pz(su.dataset.subir);
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = () => { const f=inp.files[0]; if(!f) return;
      leerImagen(f, url => { p.img = url;
        try{ save(); }catch(err){ toast('Sin espacio — borrá imágenes viejas o exportá'); }
        render(); }); };
    inp.click(); return;
  }
  const nt = d('data-nota');
  if(nt){
    const p = pz(nt.dataset.nota);
    modal('Nota interna — '+p.titulo, '<div class="field"><label>Nota</label><textarea id="ovlTxt" style="min-height:90px"></textarea></div>',
      o=>{ const v=o.querySelector('#ovlTxt').value.trim(); if(!v) return false;
        p.comentarios.push({autor:'Koreskill', texto:v, ts:Date.now()}); save(); render(); }, 'Agregar');
    return;
  }
  const rs = d('data-reset');
  if(rs){ const p=pz(rs.dataset.reset); p.estado='pendiente'; save(); render(); return; }
  const ap = d('data-aprobar');
  if(ap){ const p=pz(ap.dataset.aprobar); p.estado = p.estado==='aprobado'?'pendiente':'aprobado'; save(); render(); return; }
  const cm = d('data-comentar');
  if(cm){
    const p = pz(cm.dataset.comentar);
    modal('¿Qué cambiarías de esta pieza?', '<div class="field"><label>Tu comentario</label><textarea id="ovlTxt" style="min-height:90px" placeholder="Ej: la foto está muy oscura, y el precio no es ese."></textarea></div>',
      o=>{ const v=o.querySelector('#ovlTxt').value.trim(); if(!v) return false;
        p.comentarios.push({autor:cli().nombre, texto:v, ts:Date.now()}); p.estado='correccion'; save(); render();
        toast('Enviado — lo vamos a corregir'); }, 'Enviar');
    return;
  }

  /* clientes y datos */
  if(t.id==='btnNuevo'){
    modal('Nuevo cliente', '<div class="field"><label>Nombre de la marca</label><input id="ovlTxt" placeholder="Ej: Verdeo Café"></div>',
      o=>{ const v=o.querySelector('#ovlTxt').value.trim(); if(!v) return false;
        const n = mkCli(v); DB.clientes.push(n); UI.cliente=n.id; UI.etapa='marca'; UI.abierto=null; save(); render(); }, 'Crear');
    return;
  }
  if(t.id==='btnRenombrar'){
    modal('Renombrar cliente', `<div class="field"><label>Nombre</label><input id="ovlTxt" value="${esc(c.nombre)}"></div>`,
      o=>{ const v=o.querySelector('#ovlTxt').value.trim(); if(!v) return false; c.nombre=v; save(); render(); }, 'Guardar');
    return;
  }
  if(t.id==='btnVista'){ UI.vistaCliente=true; render(); return; }
  if(t.id==='btnSalirVista'){ UI.vistaCliente=false; render(); return; }
  if(t.id==='btnExport'){
    const json = JSON.stringify(DB, null, 2);
    const o = modal('Exportar — copiá y guardá este texto',
      `<p class="hint" style="margin:0 0 10px">Es todo el estudio: clientes, respuestas estructuradas y calendarios. Pegalo en un archivo .json.</p>
       <textarea id="ovlTxt" class="paste-box" style="min-height:200px">${esc(json)}</textarea>`, null);
    o.querySelector('#ovlTxt').select();
    copiar(json, 'Copiado al portapapeles');
    return;
  }
  if(t.id==='btnImport'){
    modal('Importar', '<p class="hint" style="margin:0 0 10px">Pegá acá un export. Reemplaza todo lo que hay ahora.</p><textarea id="ovlTxt" class="paste-box" style="min-height:200px"></textarea>',
      o=>{ try{ const n=JSON.parse(o.querySelector('#ovlTxt').value);
          if(!n.clientes?.length) throw new Error('sin clientes');
          DB=n; UI.cliente=DB.activo||DB.clientes[0].id; save(); render(); toast('Importado');
        }catch(err){ toast('Ese texto no es un export válido'); return false; } }, 'Importar');
    return;
  }
});
