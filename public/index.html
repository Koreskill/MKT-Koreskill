<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koreskill · Campaign Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── tokens ── */
:root{
  --bg:#f5f1ee;--panel:#fff;--p2:#f0ede8;--p3:#ebe7e2;
  --ink:#1a1a1a;--ink2:#5a5751;--ink3:#9a968f;
  --line:rgba(32,32,32,.09);--line2:rgba(32,32,32,.15);
  --acc:#FF7970;--acc2:#E2685A;--accs:#fff3f1;--accd:#FBD9D3;
  --on-acc:#fff;
  --ok:#16a34a;--ok-s:#f0fdf4;
  --warn:#d97706;--warn-s:#fffbeb;
  --bad:#dc2626;--bad-s:#fef2f2;
  --info:#3b82f6;--info-s:#eff6ff;
  --r:14px;--rs:9px;--rx:20px;
  --sh:0 1px 3px rgba(0,0,0,.04),0 8px 24px -8px rgba(255,121,112,.18);
  --sh2:0 2px 8px rgba(0,0,0,.06),0 16px 40px -12px rgba(0,0,0,.12);
}
[data-theme=dark]{
  --bg:#181819;--panel:#232326;--p2:#2a2a2e;--p3:#313136;
  --ink:#f0ede8;--ink2:#a8a5a0;--ink3:#6b6864;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --acc:#FF7970;--acc2:#FF9089;--accs:#2a1c1b;--accd:#5c2b28;
  --on-acc:#181819;
  --ok:#4ade80;--ok-s:#0a2716;
  --warn:#fbbf24;--warn-s:#251a04;
  --bad:#f87171;--bad-s:#2a0d0d;
  --info:#60a5fa;--info-s:#0f2344;
  --sh:0 1px 3px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.3);
  --sh2:0 2px 8px rgba(0,0,0,.5),0 16px 40px -12px rgba(0,0,0,.4);
}

/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter',ui-sans-serif,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
button,input,select,textarea{font:inherit;color:inherit;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

/* ── shell: rail + main ── */
.shell{display:grid;grid-template-columns:224px 1fr;height:100vh;overflow:hidden}

/* ── rail ── */
.rail{border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;overflow:hidden}
.rail-head{padding:13px 12px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;flex:none}
.logo-m{width:28px;height:28px;border-radius:8px;background:var(--acc);
  display:grid;place-items:center;color:var(--on-acc);font-weight:700;font-size:14px;flex:none}
.logo-t{font-size:14px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.logo-s{font-size:10px;color:var(--ink3)}
.rail-body{flex:1;overflow-y:auto;padding:8px}
.rl{font-size:10px;color:var(--ink3);padding:6px 4px 4px;font-weight:600;letter-spacing:.07em}
.colist{display:flex;flex-direction:column;gap:2px}
.co{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--rs);
  cursor:pointer;border:1px solid transparent;text-align:left;width:100%;transition:background .1s}
.co:hover{background:var(--p2)}
.co[aria-current=true]{background:var(--accs);border-color:rgba(255,121,112,.28)}
.co-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.co-dot.on{background:var(--ok)}
.co-nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.co-sub{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.co-prog{font-size:10px;color:var(--acc);font-weight:700;flex:none}
.rail-foot{border-top:1px solid var(--line);padding:8px 12px;flex:none;
  display:flex;align-items:center;gap:8px}
.api-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
.api-lbl{font-size:10.5px;color:var(--ink3);flex:1}
.th-btn{border:1px solid var(--line);border-radius:6px;padding:2px 7px;
  font-size:11px;cursor:pointer;color:var(--ink2)}
.th-btn:hover{background:var(--p2)}

/* ── main ── */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{border-bottom:1px solid var(--line);padding:8px 16px;
  display:flex;align-items:center;gap:6px;flex:none;background:var(--panel)}
.tabs{display:flex;gap:2px;background:var(--p2);padding:3px;border-radius:10px;overflow-x:auto;flex:1}
.tab{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--ink2);transition:background .1s;white-space:nowrap;
  display:flex;align-items:center;gap:5px}
.tab[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.tn{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;
  font-size:9px;font-weight:700;background:var(--line2);color:var(--ink3);flex:none}
.tab[aria-selected=true] .tn{background:var(--acc);color:var(--on-acc)}
.tab.done .tn{background:var(--ok);color:#fff}
.ctx{font-size:11.5px;color:var(--ink3);flex:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.wrap{padding:20px 22px 72px;max-width:1040px;width:100%;margin:0 auto}

/* ── botones ── */
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--rs);
  padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500;transition:all .1s;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--p2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--p2)}
.btn.ok{background:var(--ok-s);border-color:rgba(22,163,74,.3);color:var(--ok)}
.btn.warn{background:var(--warn-s);border-color:rgba(217,119,6,.3);color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── cards ── */
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px}
.card.sh{box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:780px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}

/* ── campos ── */
.field{width:100%;border:1px solid var(--line2);background:var(--panel);
  border-radius:var(--rs);padding:8px 10px;font-size:13px;transition:border-color .1s}
.field:focus{border-color:var(--acc);outline:none}
textarea.field{resize:vertical;min-height:80px;line-height:1.55}
.lab{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px;font-weight:500}

/* ── prompt box (el corazón del sistema) ── */
.prompt-box{
  border:1.5px solid var(--acc);border-radius:var(--r);
  background:var(--accs);overflow:hidden;
}
.prompt-box-head{
  padding:10px 14px;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid rgba(255,121,112,.2);
}
.prompt-box-icon{font-size:16px;flex:none}
.prompt-box-ttl{font-size:13px;font-weight:600;color:var(--acc2);flex:1}
.prompt-box-body{padding:13px 14px}
.prompt-pre{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.65;
  color:var(--ink2);white-space:pre-wrap;max-height:220px;overflow-y:auto;
}
.prompt-pre.exp{max-height:none}

/* ── paso (step del flujo) ── */
.step{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  overflow:hidden;margin-bottom:10px;transition:border-color .2s;
}
.step.active{border-color:var(--acc);box-shadow:var(--sh)}
.step.done{border-color:rgba(22,163,74,.35)}
.step-head{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
}
.step-n{
  width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--p2);color:var(--ink3);border:1px solid var(--line);
}
.step.active .step-n{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.step.done .step-n{background:var(--ok-s);color:var(--ok);border-color:rgba(22,163,74,.3)}
.step-ttl{font-size:14px;font-weight:600;letter-spacing:-.015em;flex:1}
.step-badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.sb-pending{background:var(--p2);color:var(--ink3)}
.sb-active{background:var(--accs);color:var(--acc)}
.sb-done{background:var(--ok-s);color:var(--ok)}
.step-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.step-body.hidden{display:none}
.step-desc{font-size:12px;color:var(--ink3);margin-bottom:14px;padding-top:12px}

/* ── tablero de marca ── */
.brand-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bb-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--p2)}
.bb-head{padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink3)}
.bb-body{padding:12px}
.color-row{display:flex;gap:7px;flex-wrap:wrap}
.color-swatch{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
  cursor:pointer;position:relative;flex:none;
}
.color-swatch[title]::after{
  content:attr(title);position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--ink3);white-space:nowrap;font-family:'IBM Plex Mono',monospace;
}
.font-preview{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.font-name{font-size:11px;color:var(--ink3)}
.brand-img{width:100%;aspect-ratio:3/1;object-fit:contain;display:block;background:var(--p3);border-radius:8px}
.brand-img-sq{width:80px;height:80px;object-fit:contain;display:block;background:var(--p3);border-radius:8px}

/* ── calendario ── */
.cal-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cal-filter{display:flex;gap:4px}
.cal-f{border:1px solid var(--line);background:var(--panel);border-radius:7px;
  padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink2);transition:.1s}
.cal-f.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cal-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--panel);position:relative;transition:box-shadow .15s}
.cal-card:hover{box-shadow:var(--sh)}
.cal-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--p2);
  cursor:pointer}
.cal-img-ph{aspect-ratio:1/1;display:grid;place-items:center;color:var(--ink3);
  font-size:11px;text-align:center;padding:14px;cursor:pointer}
.cal-foot{padding:8px 10px;border-top:1px solid var(--line)}
.cal-day{font-size:10.5px;font-weight:700;color:var(--acc);margin-bottom:3px}
.cal-ttl{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-type{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600;margin-top:4px}
.ct-org{background:var(--ok-s);color:var(--ok)}
.ct-pago{background:var(--info-s);color:var(--info)}
.cal-comments{border-top:1px solid var(--line);padding:8px 10px;background:var(--p2)}
.cal-comment{font-size:11px;color:var(--ink2);padding:4px 0;border-bottom:1px solid var(--line)}
.cal-comment:last-child{border-bottom:0}
.cal-add-comment{width:100%;border:0;background:transparent;font-size:11px;
  color:var(--ink3);padding:4px 0;cursor:text}
.cal-add-comment:focus{outline:none;color:var(--ink)}

/* ── product tags ── */
.prod-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px}
.prod-tag-x{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:13px;line-height:1}
.prod-tag-x:hover{color:var(--bad)}

/* ── estrategia visual ── */
.strat-board{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.strat-week{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strat-week-head{padding:8px 13px;background:var(--p2);border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.strat-week-body{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.strat-day{border:1px solid var(--line);border-radius:8px;padding:6px;min-height:64px;
  font-size:10.5px;background:var(--panel);cursor:pointer;transition:.1s}
.strat-day:hover{border-color:var(--acc)}
.strat-day-n{font-weight:700;color:var(--ink3);margin-bottom:4px;font-size:10px}
.strat-pill{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9.5px;
  font-weight:600;margin-top:2px;white-space:nowrap}
.sp-emo{background:rgba(255,121,112,.15);color:var(--acc2)}
.sp-com{background:var(--ok-s);color:var(--ok)}
.sp-edu{background:var(--info-s);color:var(--info)}

/* ── entrega timeline ── */
.delivery-tl{display:flex;flex-direction:column;gap:0;position:relative;padding-left:32px}
.delivery-tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;
  width:2px;background:var(--line)}
.dt-item{position:relative;padding:0 0 24px}
.dt-dot{position:absolute;left:-32px;top:3px;width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;
  font-size:9px;font-weight:700;color:var(--ink3)}
.dt-item.done .dt-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.dt-item.now .dt-dot{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.dt-day{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:2px}
.dt-ttl{font-size:14px;font-weight:600;letter-spacing:-.015em}
.dt-desc{font-size:12.5px;color:var(--ink2);margin-top:3px}
.dt-items{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dt-item-tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;
  background:var(--p2);border:1px solid var(--line);color:var(--ink2)}

/* ── misc ── */
.divider{height:1px;background:var(--line);margin:16px 0}
.note{font-size:12px;color:var(--ink3);line-height:1.5}
.label{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  border-radius:999px;font-size:11px;font-weight:600}
.b-ok{background:var(--ok-s);color:var(--ok)}
.b-wait{background:var(--warn-s);color:var(--warn)}
.b-off{background:var(--p2);color:var(--ink3)}
.b-acc{background:var(--accs);color:var(--acc2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(14px);
  opacity:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;
  font-size:13px;z-index:999;transition:.18s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* ── upload drop ── */
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:20px;
  text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--accs)}
.drop big{font-weight:500;font-size:13.5px;display:block;margin-bottom:3px}
.drop small{color:var(--ink3);font-size:11.5px}
</style>
</head>
<body>
<div class="shell">

  <!-- ════ RAIL ════ -->
  <aside class="rail">
    <div class="rail-head">
      <div class="logo-m">K</div>
      <div>
        <div class="logo-t">Koreskill</div>
        <div class="logo-s">campaign studio v2</div>
      </div>
    </div>
    <div class="rail-body">
      <div class="rl">Clientes</div>
      <div class="colist" id="colist"></div>
      <button class="btn sm ghost" id="newCo" style="margin-top:8px;width:100%">+ Nuevo cliente</button>
    </div>
    <div class="rail-foot">
      <div class="api-dot"></div>
      <span class="api-lbl">v2 · humano en el loop</span>
      <button class="th-btn" id="thBtn">◐</button>
    </div>
  </aside>

  <!-- ════ MAIN ════ -->
  <main class="main">
    <div class="topbar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <span class="ctx" id="ctx"></span>
      <button class="btn sm ghost" id="exportBtn" style="margin-left:4px">Exportar</button>
    </div>
    <div class="scroll">
      <div class="wrap" id="panel"></div>
    </div>
  </main>

</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
