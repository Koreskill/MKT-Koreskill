<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu campaña · Koreskill</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1EE; --panel:#fff; --panel-2:#faf8f5;
  --ink:#202020; --ink-2:#625E59; --ink-3:#9a968f;
  --line:rgba(32,32,32,.09); --acc:#FF7970; --acc-soft:#FFF3F1;
  --good:#16a34a; --good-soft:#f0fdf4; --warn:#d97706; --warn-soft:#fffbeb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.mark{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.brand{font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.top-grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:-.035em;line-height:1.12;margin-bottom:6px}
.sub{color:var(--ink-2);font-size:14px;margin-bottom:26px}
.sec{margin-top:32px}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card-k{font-size:12px;color:var(--ink-3);margin-bottom:5px}
.card-v{font-size:16px;font-weight:600;letter-spacing:-.02em}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;margin-top:8px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.wait{background:var(--warn-soft);color:var(--warn)}
.badge.off{background:var(--panel-2);color:var(--ink-3)}
.timeline{display:flex;align-items:flex-start;gap:0;margin-top:6px;overflow-x:auto;padding-bottom:8px}
.tl-step{flex:1;min-width:120px;text-align:center;position:relative;padding-top:26px}
.tl-step::before{content:"";position:absolute;top:9px;left:50%;right:-50%;height:2px;background:var(--line)}
.tl-step:last-child::before{display:none}
.tl-dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--line);z-index:2}
.tl-step.done .tl-dot{background:var(--acc);border-color:var(--acc)}
.tl-step.now .tl-dot{background:var(--warn);border-color:var(--warn);animation:p 1.8s ease-in-out infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.4)}50%{box-shadow:0 0 0 6px rgba(217,119,6,0)}}
.tl-lbl{font-size:12px;font-weight:600}
.tl-sub{font-size:11px;color:var(--ink-3)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.img{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.img img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.img-ph{aspect-ratio:1/1;background:var(--panel-2);display:grid;place-items:center;color:var(--ink-3);font-size:11px;text-align:center;padding:12px}
.img-f{padding:8px 10px;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line)}
.copy-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.copy-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.copy-g{font-size:14px;font-weight:600;margin-bottom:5px}
.copy-b{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.6}
.copy-c{font-size:13px;color:var(--acc);font-weight:500;margin-top:7px}
.mini-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer;margin-left:auto}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;transition:.18s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top">
  <div class="mark">K</div>
  <div class="brand">Koreskill<small>campaign studio</small></div>
  <div class="top-grow"></div>
  <a class="btn" href="/">← Volver al admin</a>
</div>

<div class="wrap" id="wrap"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

const id = new URLSearchParams(location.search).get('id');
const DB = JSON.parse(localStorage.getItem('koreskill.studio.v1') || '{"clientes":[]}');
const c = DB.clientes.find(x => x.id === id) || DB.clientes.find(x => x.id === DB.activo) || DB.clientes[0];

if (!c) {
  $('#wrap').innerHTML = '<div class="empty"><h2>No hay campaña para mostrar</h2></div>';
} else {
  const hechas = Object.values(c.etapas||{}).filter(v=>v&&v.trim().length>40).length;
  const imgs = Object.values(c.imagenes||{});
  const estado = hechas >= 6 ? 'entrega' : hechas >= 4 ? 'produccion' : 'estrategia';

  $('#wrap').innerHTML = `
    <h1>${esc(c.ficha.nombre)}</h1>
    <p class="sub">${esc([c.ficha.rubro, c.ficha.ciudad, c.ficha.pais].filter(Boolean).join(' · '))} — Campaña del mes</p>

    <div class="sec">
      <div class="sec-t">Estado de la campaña</div>
      <div class="cards3">
        <div class="card">
          <div class="card-k">Estrategia</div>
          <div class="card-v">${hechas >= 4 ? 'Definida' : 'En proceso'}</div>
          <span class="badge ${hechas>=4?'ok':'wait'}">${hechas>=4?'✓ Aprobada':'En proceso'}</span>
        </div>
        <div class="card">
          <div class="card-k">Producción</div>
          <div class="card-v">${imgs.length} de ${(c.prompts||[]).length || 12} piezas</div>
          <span class="badge ${imgs.length>=(c.prompts||[]).length&&imgs.length>0?'ok':imgs.length?'wait':'off'}">
            ${imgs.length>=(c.prompts||[]).length&&imgs.length>0?'✓ Completa':imgs.length?'En proceso':'Pendiente'}</span>
        </div>
        <div class="card">
          <div class="card-k">Entrega final</div>
          <div class="card-v">${(c.etapas?.e6||'').length>40?'Lista':'Día 22'}</div>
          <span class="badge ${(c.etapas?.e6||'').length>40?'ok':'off'}">
            ${(c.etapas?.e6||'').length>40?'✓ Entregada':'Programada'}</span>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-t">Cronograma del mes</div>
      <div class="timeline">
        ${[
          ['Día 1','Brief inicial', hechas>=1],
          ['Día 2','Estrategia', hechas>=4],
          ['Día 8','Primer lote', imgs.length>0],
          ['Día 15','Segundo lote', imgs.length>=6],
          ['Día 22','Entrega final', (c.etapas?.e6||'').length>40]
        ].map(([d,l,done],i,a)=>{
          const prevDone = i===0 || a[i-1][2];
          const now = !done && prevDone;
          return `<div class="tl-step ${done?'done':''} ${now?'now':''}">
            <div class="tl-dot"></div>
            <div class="tl-lbl">${d}</div>
            <div class="tl-sub">${l}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    ${imgs.length?`<div class="sec">
      <div class="sec-t">Piezas producidas (${imgs.length})</div>
      <div class="imgs">
        ${(c.prompts||[]).map(p=>{
          const u = c.imagenes?.['p'+p.n];
          return `<div class="img">
            ${u?`<img src="${esc(u)}" alt="${esc(p.titulo||'')}">`:`<div class="img-ph">Pendiente<br>#${p.n}</div>`}
            <div class="img-f">${esc(p.titulo||'Pieza '+p.n)}<br><span style="color:var(--ink-3)">${esc(p.formato||'')}</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''}

    ${(c.copies||[]).length?`<div class="sec">
      <div class="sec-t">Textos listos para publicar (${c.copies.length})</div>
      ${c.copies.map((x,i)=>`<div class="copy-item">
        <div class="copy-h">
          <span class="tag">${esc(x.formato||'feed')}</span>
          <span style="font-size:12px;color:var(--ink-3)">${esc(x.angulo||'')}</span>
          <button class="mini-btn" data-cp="${i}">Copiar</button>
        </div>
        <div class="copy-g">${esc(x.gancho||'')}</div>
        <div class="copy-b">${esc(x.cuerpo||'')}</div>
        <div class="copy-c">${esc(x.cta||'')}</div>
      </div>`).join('')}
    </div>`:''}

    ${(c.whatsapp||[]).length?`<div class="sec">
      <div class="sec-t">Respuestas de WhatsApp (${c.whatsapp.length})</div>
      ${c.whatsapp.map((w,i)=>`<div class="copy-item">
        <div class="copy-h">
          <span class="tag">${esc(w.momento||'')}</span>
          <span style="font-size:12px;color:var(--ink-3)">${esc(w.cuando||'')}</span>
          <button class="mini-btn" data-wp="${i}">Copiar</button>
        </div>
        <div class="copy-b" style="background:var(--panel-2);padding:11px;border-radius:9px">${esc(w.texto||'')}</div>
      </div>`).join('')}
    </div>`:''}

    ${(c.etapas?.e6||'').length>40?`<div class="sec">
      <div class="sec-t">Resumen de la entrega</div>
      <div class="card" style="white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--ink-2)">${esc(c.etapas.e6)}</div>
    </div>`:''}
  `;

  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{
    const x=c.copies[+b.dataset.cp];
    navigator.clipboard.writeText(`${x.gancho}\n\n${x.cuerpo}\n\n${x.cta}`);
    toast('Texto copiado');
  });
  document.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(c.whatsapp[+b.dataset.wp].texto);
    toast('Plantilla copiada');
  });
}
</script>
</body>
</html>
