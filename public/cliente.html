<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu proceso · Koreskill</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1EE;--panel:#fff;--panel-2:#faf8f5;--ink:#202020;--ink-2:#625e59;--ink-3:#9a968f;--line:rgba(32,32,32,.1);--acc:#FF7970;--acc-soft:#FFF3F1;--good:#16a34a;--good-soft:#f0fdf4;--warn:#d97706;--warn-soft:#fffbeb}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6}.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.mark{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}.brand{font-size:14px;font-weight:600;line-height:1.1}.brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}.top-grow{flex:1}.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:-.035em;line-height:1.12;margin-bottom:6px}.sub{color:var(--ink-2);font-size:14px;margin-bottom:26px}.sec{margin-top:32px}.sec-t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card-k{font-size:12px;color:var(--ink-3);margin-bottom:5px}.card-v{font-size:16px;font-weight:600;letter-spacing:-.02em}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;margin-top:8px}.badge.ok{background:var(--good-soft);color:var(--good)}.badge.wait{background:var(--warn-soft);color:var(--warn)}.badge.off{background:var(--panel-2);color:var(--ink-3)}.timeline{display:flex;align-items:flex-start;gap:0;margin-top:6px;overflow-x:auto;padding-bottom:8px}.tl-step{flex:1;min-width:125px;text-align:center;position:relative;padding-top:26px}.tl-step:before{content:"";position:absolute;top:9px;left:50%;right:-50%;height:2px;background:var(--line)}.tl-step:last-child:before{display:none}.tl-dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--line);z-index:2}.tl-step.done .tl-dot{background:var(--acc);border-color:var(--acc)}.tl-step.now .tl-dot{background:var(--warn);border-color:var(--warn);animation:p 1.8s ease-in-out infinite}@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.4)}50%{box-shadow:0 0 0 6px rgba(217,119,6,0)}}.tl-lbl{font-size:12px;font-weight:600}.tl-sub{font-size:11px;color:var(--ink-3)}.list{display:flex;flex-direction:column;gap:8px}.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.item-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}.tag{padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:var(--acc-soft);color:var(--acc)}.item-title{font-size:14px;font-weight:600}.item-body{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.6}.item-cta{font-size:13px;color:var(--acc);font-weight:500;margin-top:7px}.copy-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer;margin-left:auto}.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){.top{padding:12px 14px}.wrap{padding:22px 14px 60px}.top .btn{padding:7px 10px;font-size:12px}.timeline{justify-content:flex-start}.tl-step{flex:0 0 125px}}
</style>
</head>
<body>
<div class="top"><div class="mark">K</div><div class="brand">Koreskill<small>campaign studio</small></div><div class="top-grow"></div><a class="btn" href="/">← Volver al proceso</a></div>
<div class="wrap" id="wrap"></div><div class="toast" id="toast"></div>
<script>
const $=selector=>document.querySelector(selector);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let toastT;function toast(message){const target=$('#toast');target.textContent=message;target.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>target.classList.remove('show'),2200)}
const id=new URLSearchParams(location.search).get('id');let db;try{db=JSON.parse(localStorage.getItem('koreskill.studio.v2')||localStorage.getItem('koreskill.studio.v1')||'{"clientes":[]}')}catch{db={clientes:[]}}const c=(db.clientes||[]).find(client=>client.id===id)||(db.clientes||[]).find(client=>client.id===db.activo)||(db.clientes||[])[0];
function done(c,stage){if(stage==='marca')return Boolean(c.marca?.diagnostico||c.ficha?.descripcion);if(stage==='productos')return (c.productos||[]).length>0;if(stage==='plan')return Boolean(c.mes_actual?.objetivo&&(c.mes_actual?.mensaje_central||c.mes_actual?.plan));if(stage==='produccion')return Boolean((c.produccion?.prompts||[]).length||(c.produccion?.guiones||[]).length||(c.produccion?.copies||[]).length||(c.produccion?.whatsapp||[]).length);if(stage==='entrega')return Boolean(c.entrega?.resumen||c.entrega?.drive_url||c.entrega?.estado==='entregada');return false}
function status(c){return ['marca','productos','plan','produccion','entrega'].filter(stage=>done(c,stage)).length}
if(!c){$('#wrap').innerHTML='<div class="empty"><h2>No hay proceso para mostrar</h2></div>'}else{
 const pieces=c.mes_actual?.piezas||[];const products=c.productos||[];const prompts=c.produccion?.prompts||[];const copies=c.produccion?.copies||[];const replies=c.produccion?.whatsapp||[];const scripts=c.produccion?.guiones||[];
 $('#wrap').innerHTML=`<h1>${esc(c.ficha?.nombre||'Tu marca')}</h1><p class="sub">${esc([c.ficha?.rubro,c.ficha?.ciudad,c.ficha?.pais].filter(Boolean).join(' · '))} · ${esc(c.mes_actual?.mes||'Proceso del mes')}</p>
 <div class="sec"><div class="sec-t">Estado del proceso</div><div class="cards3"><div class="card"><div class="card-k">Avance</div><div class="card-v">${status(c)} de 5 momentos</div><span class="badge ${status(c)>=4?'ok':'wait'}">${status(c)>=4?'✓ En etapa final':'En proceso'}</span></div><div class="card"><div class="card-k">Plan</div><div class="card-v">${pieces.length} piezas definidas</div><span class="badge ${pieces.length?'ok':'off'}">${pieces.length?'✓ Organizado':'Pendiente'}</span></div><div class="card"><div class="card-k">Entrega</div><div class="card-v">${esc(c.entrega?.estado||'En proceso')}</div><span class="badge ${c.entrega?.estado==='entregada'?'ok':'wait'}">${c.entrega?.estado==='entregada'?'✓ Lista':'A revisar'}</span></div></div></div>
 <div class="sec"><div class="sec-t">Recorrido de trabajo</div><div class="timeline">${[['Marca','Ordenamos la información','marca'],['Productos','Definimos el foco','productos'],['Plan','Elegimos qué publicar','plan'],['Producción','Preparamos materiales','produccion'],['Entrega','Revisamos y organizamos','entrega']].map(([label,sub,stage],index,all)=>`<div class="tl-step ${done(c,stage)?'done':''} ${!done(c,stage)&&(index===0||done(c,all[index-1][2]))?'now':''}"><div class="tl-dot"></div><div class="tl-lbl">${label}</div><div class="tl-sub">${sub}</div></div>`).join('')}</div></div>
 ${(c.marca?.diagnostico||c.ficha?.descripcion)?`<div class="sec"><div class="sec-t">Qué entendimos de la marca</div><div class="card item-body">${esc(c.marca?.diagnostico||c.ficha?.descripcion)}</div></div>`:''}
 ${products.length?`<div class="sec"><div class="sec-t">Productos y foco del mes</div><div class="list">${products.map(product=>`<div class="item"><div class="item-h"><span class="tag">${product.id===c.mes_actual?.producto_principal_id?'Foco del mes':'Producto'}</span><span class="item-title">${esc(product.nombre||'Sin nombre')}</span></div><div class="item-body">${esc(product.descripcion||'Información pendiente')}${product.precio?`\nPrecio: ${esc(product.precio)}`:''}</div></div>`).join('')}</div></div>`:''}
 ${(c.mes_actual?.objetivo||c.mes_actual?.plan)?`<div class="sec"><div class="sec-t">Plan del mes</div><div class="card"><div class="card-k">Objetivo</div><div class="item-title">${esc(c.mes_actual?.objetivo||'Pendiente')}</div><div class="card-k" style="margin-top:12px">Mensaje central</div><div class="item-body">${esc(c.mes_actual?.mensaje_central||'Pendiente')}</div>${c.mes_actual?.plan?`<div class="card-k" style="margin-top:12px">Plan</div><div class="item-body">${esc(c.mes_actual.plan)}</div>`:''}</div></div>`:''}
 ${pieces.length?`<div class="sec"><div class="sec-t">Calendario (${pieces.length})</div><div class="list">${pieces.map(piece=>`<div class="item"><div class="item-h"><span class="tag">${esc(piece.dia||'Día pendiente')}</span><span class="tag">${esc(piece.formato||'feed')}</span><span class="item-title">${esc(piece.titulo||'Sin título')}</span></div><div class="item-body">${esc(piece.objetivo||'Objetivo pendiente')}</div><div class="item-cta">${esc(piece.cta||'CTA pendiente')}</div></div>`).join('')}</div></div>`:''}
 ${prompts.length?`<div class="sec"><div class="sec-t">Prompts preparados (${prompts.length})</div><div class="list">${prompts.map((prompt,index)=>`<div class="item"><div class="item-h"><span class="tag">${esc(prompt.formato||'1:1')}</span><span class="item-title">${esc(prompt.titulo||`Prompt ${index+1}`)}</span><button class="copy-btn" data-copy="prompt" data-index="${index}">Copiar</button></div><div class="item-body">${esc(prompt.prompt||'')}</div></div>`).join('')}</div></div>`:''}
 ${scripts.length?`<div class="sec"><div class="sec-t">Guiones preparados (${scripts.length})</div><div class="list">${scripts.map((script,index)=>`<div class="item"><div class="item-h"><span class="tag">${esc(script.duracion||'30s')}</span><span class="item-title">${esc(script.titulo||`Guion ${index+1}`)}</span><button class="copy-btn" data-copy="script" data-index="${index}">Copiar</button></div><div class="item-body">${esc(script.gancho||'')}\n${esc((script.bloques||[]).map(block=>`[${block.t}] ${block.voz}`).join('\n'))}\n${esc(script.cierre||'')}</div></div>`).join('')}</div></div>`:''}
 ${copies.length?`<div class="sec"><div class="sec-t">Copies listos (${copies.length})</div><div class="list">${copies.map((copy,index)=>`<div class="item"><div class="item-h"><span class="tag">${esc(copy.formato||'feed')}</span><span class="item-title">${esc(copy.gancho||`Copy ${index+1}`)}</span><button class="copy-btn" data-copy="copy" data-index="${index}">Copiar</button></div><div class="item-body">${esc(copy.cuerpo||'')}</div><div class="item-cta">${esc(copy.cta||'')}</div></div>`).join('')}</div></div>`:''}
 ${replies.length?`<div class="sec"><div class="sec-t">Respuestas de WhatsApp (${replies.length})</div><div class="list">${replies.map((reply,index)=>`<div class="item"><div class="item-h"><span class="tag">${esc(reply.momento||'Respuesta')}</span><span class="item-title">${esc(reply.cuando||'')}</span><button class="copy-btn" data-copy="reply" data-index="${index}">Copiar</button></div><div class="item-body">${esc(reply.texto||'')}</div></div>`).join('')}</div></div>`:''}
 ${(c.entrega?.resumen||c.entrega?.drive_url||c.entrega?.notas)?`<div class="sec"><div class="sec-t">Entrega y próximo paso</div><div class="card"><div class="item-body">${esc(c.entrega?.resumen||'Resumen pendiente')}</div>${c.entrega?.notas?`<div class="card-k" style="margin-top:12px">Notas</div><div class="item-body">${esc(c.entrega.notas)}</div>`:''}${c.entrega?.proxima_accion?`<div class="card-k" style="margin-top:12px">Próxima acción</div><div class="item-title">${esc(c.entrega.proxima_accion)}</div>`:''}${c.entrega?.drive_url?`<p style="margin-top:12px"><a href="${esc(c.entrega.drive_url)}" target="_blank" rel="noreferrer" class="btn">Abrir materiales</a></p>`:''}</div></div>`:''}`;
 document.querySelectorAll('[data-copy]').forEach(button=>button.onclick=()=>{const index=+button.dataset.index;let text='';if(button.dataset.copy==='prompt')text=prompts[index]?.prompt||'';if(button.dataset.copy==='reply')text=replies[index]?.texto||'';if(button.dataset.copy==='copy'){const x=copies[index]||{};text=`${x.gancho||''}\n\n${x.cuerpo||''}\n\n${x.cta||''}`}if(button.dataset.copy==='script'){const x=scripts[index]||{};text=`${x.titulo||''}\n${x.gancho||''}\n\n${(x.bloques||[]).map(block=>`[${block.t}] ${block.voz}`).join('\n')}\n\n${x.cierre||''}`}if(!navigator.clipboard?.writeText)return toast('Copiá el texto manualmente');navigator.clipboard.writeText(text).then(()=>toast('Copiado')).catch(()=>toast('No pude copiar automáticamente'))});
}
</script>
</body>
</html>
